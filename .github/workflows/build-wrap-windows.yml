name: Build and release Windows wrapper DLL

on:
  workflow_dispatch:
  push:
    tags:
      - 'wrap-v*'

permissions:
  contents: write

concurrency:
  group: wrap-windows-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  windows-dll:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_BAZEL_REPIN: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch Windows runtime files
        run: git lfs pull --include='prebuilt/windows_x86_64/**'

      - name: Restore Bazel caches
        id: bazel-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            C:/b/repository-cache
            C:/b/disk-cache
          key: wrap-windows-${{ hashFiles('.bazelversion', 'WORKSPACE', 'Cargo.lock', 'PATCH.*', 'pack/patches/**') }}-${{ github.sha }}
          restore-keys: |
            wrap-windows-${{ hashFiles('.bazelversion', 'WORKSPACE', 'Cargo.lock', 'PATCH.*', 'pack/patches/**') }}-
            wrap-windows-

      - name: Install Bazelisk
        run: |
          New-Item -ItemType Directory -Path C:/b/tools -Force | Out-Null
          gh release download --repo bazelbuild/bazelisk --pattern bazelisk-windows-amd64.exe --output C:/b/tools/bazel.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:/b/tools' >> $env:GITHUB_PATH

      - name: Build DLLs and package SDK
        run: ./pack/build/Build-Windows.ps1 -OutputDirectory out/LiteRtLm -BazelOutputBase C:/b/output -BazelUserRoot C:/b/user

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiteRtLm-Win64-${{ github.sha }}
          path: out/*.zip
          if-no-files-found: error

      - name: Archive version branch and publish release
        run: ./.github/scripts/Publish-Wrapper.ps1

      - name: Save Bazel caches
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            C:/b/repository-cache
            C:/b/disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
